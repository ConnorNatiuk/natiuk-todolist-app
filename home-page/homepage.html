<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link href="homepage-style.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/9fa1585a4c.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="todo-app">
        <h1>Welcome to my to-do list!</h1>
        <div class="todo-form">
            <input type="text" class="list-input" placeholder="Type in To-Do here">
            <button class="submit-todo">Submit</button>
        </div>
        <ul class="todo-list"></ul>
    </div>

    <div class="profiles">
        <button id="login-button">Login</button>
        <h3>Hello, <span id="current-user-name"></span></h3>
    </div>
    <script src="homepage-script.js"></script>
</body>
</html>
